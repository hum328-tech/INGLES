<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Vocabulary Quizlet</title>
<style>
:root{
  --bg:#f5f7fb;
  --panel:#ffffff;
  --text:#172033;
  --muted:#6b7280;
  --primary:#4f46e5;
  --primary2:#7c3aed;
  --good:#16a34a;
  --bad:#dc2626;
  --border:#e5e7eb;
  --shadow:0 16px 40px rgba(15,23,42,.12);
}
*{box-sizing:border-box}
body{
  margin:0;
  font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  background:linear-gradient(135deg,#eef2ff,#f8fafc 55%,#f5f3ff);
  color:var(--text);
  min-height:100vh;
}
header{
  background:rgba(255,255,255,.9);
  backdrop-filter:blur(10px);
  border-bottom:1px solid var(--border);
  position:sticky;
  top:0;
  z-index:10;
}
.header-inner{
  max-width:1100px;
  margin:auto;
  padding:16px 22px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:20px;
}
h1{font-size:1.2rem;margin:0}
nav{display:flex;gap:8px;flex-wrap:wrap}
nav button,.btn{
  border:0;
  border-radius:12px;
  padding:10px 16px;
  cursor:pointer;
  font-weight:700;
  transition:.18s ease;
}
nav button{
  background:#eef2ff;
  color:#3730a3;
}
nav button.active,.btn.primary{
  color:#fff;
  background:linear-gradient(135deg,var(--primary),var(--primary2));
}
nav button:hover,.btn:hover{transform:translateY(-1px)}
main{max-width:950px;margin:30px auto;padding:0 20px 50px}
.view{display:none}
.view.active{display:block}
.hero{
  background:var(--panel);
  border:1px solid var(--border);
  border-radius:24px;
  box-shadow:var(--shadow);
  padding:24px;
}
.topline{display:flex;justify-content:space-between;gap:20px;align-items:center;margin-bottom:16px}
.badge{font-size:.9rem;color:var(--muted);font-weight:700}
.progress{height:10px;background:#e5e7eb;border-radius:999px;overflow:hidden}
.progress > div{height:100%;background:linear-gradient(90deg,var(--primary),var(--primary2));width:0%;transition:.2s}
.flash-wrap{perspective:1000px;margin:28px 0}
.flashcard{
  min-height:330px;
  border-radius:24px;
  position:relative;
  transform-style:preserve-3d;
  transition:transform .45s;
  cursor:pointer;
}
.flashcard.flipped{transform:rotateY(180deg)}
.face{
  position:absolute;
  inset:0;
  border-radius:24px;
  backface-visibility:hidden;
  display:flex;
  align-items:center;
  justify-content:center;
  flex-direction:column;
  gap:14px;
  padding:30px;
  text-align:center;
  box-shadow:var(--shadow);
  border:1px solid var(--border);
}
.front{background:#fff}
.back{background:linear-gradient(135deg,#eef2ff,#faf5ff);transform:rotateY(180deg)}
.word{font-size:clamp(2.4rem,8vw,5.2rem);font-weight:900;letter-spacing:-.03em}
.hint{color:var(--muted);font-weight:600}
.controls{display:flex;justify-content:center;gap:12px;flex-wrap:wrap}
.btn.secondary{background:#fff;border:1px solid var(--border);color:var(--text)}
.question{
  font-size:clamp(1.8rem,5vw,3.1rem);
  font-weight:900;
  text-align:center;
  margin:30px 0 22px;
}
.subtext{text-align:center;color:var(--muted);font-weight:600}
.options{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;margin-top:24px}
.option{
  border:2px solid var(--border);
  background:#fff;
  border-radius:18px;
  padding:18px;
  font-size:1.1rem;
  font-weight:800;
  cursor:pointer;
  min-height:74px;
  transition:.15s;
}
.option:hover{border-color:#a5b4fc;transform:translateY(-1px)}
.option.correct{border-color:#22c55e;background:#f0fdf4;color:#166534}
.option.wrong{border-color:#ef4444;background:#fef2f2;color:#991b1b}
.feedback{min-height:30px;text-align:center;margin-top:18px;font-weight:800}
.feedback.good{color:var(--good)}
.feedback.bad{color:var(--bad)}
.write-box{max-width:620px;margin:24px auto 0}
.write-box input{
  width:100%;
  border:2px solid var(--border);
  border-radius:16px;
  padding:18px 20px;
  font-size:1.25rem;
  outline:none;
}
.write-box input:focus{border-color:#818cf8;box-shadow:0 0 0 4px rgba(99,102,241,.1)}
.write-actions{display:flex;justify-content:center;gap:12px;margin-top:16px;flex-wrap:wrap}
.summary{
  text-align:center;
  padding:38px 20px;
}
.summary h2{font-size:2rem;margin-bottom:8px}
.score{font-size:4rem;font-weight:900;color:var(--primary)}
.list-view{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px;margin-top:20px}
.vocab-item{background:#fff;border:1px solid var(--border);border-radius:16px;padding:14px 16px;box-shadow:0 6px 16px rgba(15,23,42,.05)}
.vocab-item strong{display:block;font-size:1.1rem}.vocab-item span{color:var(--muted)}
.small{font-size:.88rem;color:var(--muted)}
@media(max-width:650px){
  .header-inner{align-items:flex-start;flex-direction:column}
  nav{width:100%}
  nav button{flex:1}
  .options{grid-template-columns:1fr}
  .flashcard{min-height:270px}
}
</style>
</head>
<body>
<header>
  <div class="header-inner">
    <div>
      <h1>Vocabulary Practice</h1>
      <div class="small">Flashcards · Multiple Choice · Writing</div>
    </div>
    <nav>
      <button class="active" data-view="flashcards">Flashcards</button>
      <button data-view="multiple">Opción múltiple</button>
      <button data-view="writing">Escribir</button>
      <button data-view="list">Lista</button>
    </nav>
  </div>
</header>

<main>
  <section id="flashcards" class="view active">
    <div class="hero">
      <div class="topline">
        <div class="badge" id="flashCount"></div>
        <div class="badge">Haz clic en la tarjeta para voltearla</div>
      </div>
      <div class="progress"><div id="flashProgress"></div></div>
      <div class="flash-wrap">
        <div class="flashcard" id="flashcard">
          <div class="face front"><div class="hint">English</div><div class="word" id="frontWord"></div></div>
          <div class="face back"><div class="hint">Español</div><div class="word" id="backWord"></div></div>
        </div>
      </div>
      <div class="controls">
        <button class="btn secondary" id="prevCard">← Anterior</button>
        <button class="btn secondary" id="shuffleCards">Mezclar</button>
        <button class="btn primary" id="nextCard">Siguiente →</button>
      </div>
    </div>
  </section>

  <section id="multiple" class="view">
    <div class="hero" id="mcArea">
      <div class="topline">
        <div class="badge" id="mcCount"></div>
        <div class="badge" id="mcScore">Puntos: 0</div>
      </div>
      <div class="progress"><div id="mcProgress"></div></div>
      <div class="subtext">Selecciona la traducción correcta.</div>
      <div class="question" id="mcQuestion"></div>
      <div class="options" id="mcOptions"></div>
      <div class="feedback" id="mcFeedback"></div>
    </div>
  </section>

  <section id="writing" class="view">
    <div class="hero" id="writeArea">
      <div class="topline">
        <div class="badge" id="writeCount"></div>
        <div class="badge" id="writeScore">Puntos: 0</div>
      </div>
      <div class="progress"><div id="writeProgress"></div></div>
      <div class="subtext">Escribe la traducción al español.</div>
      <div class="question" id="writeQuestion"></div>
      <div class="write-box">
        <input id="writeInput" autocomplete="off" placeholder="Escribe tu respuesta..." />
        <div class="write-actions">
          <button class="btn primary" id="checkWrite">Comprobar</button>
          <button class="btn secondary" id="skipWrite">Saltar</button>
        </div>
      </div>
      <div class="feedback" id="writeFeedback"></div>
    </div>
  </section>

  <section id="list" class="view">
    <div class="hero">
      <div class="topline"><div><strong>Vocabulario completo</strong></div><div class="badge" id="listCount"></div></div>
      <div class="list-view" id="vocabList"></div>
    </div>
  </section>
</main>

<script>
const vocab = [
  ["and","y"],["swimming","nadar"],["sport","deporte"],["cold","frío"],["can","poder"],["ill","enfermo"],["bed","cama"],["scared","miedo"],["late","tarde"],["again","otra vez"],["o'clock","en punto"],["good","bueno"],["friends","amigos"],["key","llave"],["table","mesa"],["tired","cansado"],["hungry","hambre"],["teacher","maestro"],["those","esos"],["people","gente"],["sunny","soleado"],["warm","cálido"],["today","hoy"],["weather","clima"],["nice","agradable"],["rich","rico"],["bag","bolsa"],["heavy","pesado"],["look","ver"],["player","jugador"],["home","casa"],["her","de ella"],["children","niños"],["school","escuela"],["at","en"],["driver","chofer"],["nurse","enfermera"],["but","pero"],["thirsty","sediento"],["very","muy"],["chair","silla"],["these","estos"],["beautiful","hermoso"],["early","temprano"],["work","trabajo"],["coat","abrigo"]
];

const shuffle = arr => [...arr].sort(() => Math.random() - .5);
const normalize = s => s.trim().toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'');

// navegación
const navButtons = document.querySelectorAll('nav button');
const views = document.querySelectorAll('.view');
navButtons.forEach(btn=>btn.addEventListener('click',()=>{
  navButtons.forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  views.forEach(v=>v.classList.remove('active'));
  document.getElementById(btn.dataset.view).classList.add('active');
}));

// FLASHCARDS
let flashDeck = [...vocab];
let flashIndex = 0;
const flashcard = document.getElementById('flashcard');
function renderFlash(){
  const [en,es] = flashDeck[flashIndex];
  frontWord.textContent=en;
  backWord.textContent=es;
  flashCount.textContent=`${flashIndex+1} / ${flashDeck.length}`;
  flashProgress.style.width=`${((flashIndex+1)/flashDeck.length)*100}%`;
  flashcard.classList.remove('flipped');
}
flashcard.addEventListener('click',()=>flashcard.classList.toggle('flipped'));
nextCard.onclick=()=>{flashIndex=(flashIndex+1)%flashDeck.length;renderFlash()};
prevCard.onclick=()=>{flashIndex=(flashIndex-1+flashDeck.length)%flashDeck.length;renderFlash()};
shuffleCards.onclick=()=>{flashDeck=shuffle(flashDeck);flashIndex=0;renderFlash()};
renderFlash();

// MULTIPLE CHOICE
let mcDeck=[], mcIndex=0, mcPoints=0, mcLocked=false;
function startMC(){mcDeck=shuffle(vocab);mcIndex=0;mcPoints=0;mcLocked=false;renderMC()}
function renderMC(){
  if(mcIndex>=mcDeck.length){
    mcArea.innerHTML=`<div class="summary"><h2>¡Actividad terminada!</h2><div class="score">${mcPoints}/${mcDeck.length}</div><p>Respuestas correctas</p><button class="btn primary" onclick="location.reload()">Volver a empezar</button></div>`;
    return;
  }
  mcLocked=false;
  const [en, correct] = mcDeck[mcIndex];
  mcQuestion.textContent=en;
  mcCount.textContent=`${mcIndex+1} / ${mcDeck.length}`;
  mcScore.textContent=`Puntos: ${mcPoints}`;
  mcProgress.style.width=`${(mcIndex/mcDeck.length)*100}%`;
  mcFeedback.textContent=''; mcFeedback.className='feedback';
  const distractors=shuffle(vocab.filter(v=>v[1]!==correct)).slice(0,3).map(v=>v[1]);
  const answers=shuffle([correct,...distractors]);
  mcOptions.innerHTML='';
  answers.forEach(ans=>{
    const b=document.createElement('button');
    b.className='option'; b.textContent=ans;
    b.onclick=()=>{
      if(mcLocked) return;
      mcLocked=true;
      const buttons=[...mcOptions.children];
      buttons.forEach(x=>{if(x.textContent===correct)x.classList.add('correct')});
      if(ans===correct){mcPoints++;mcFeedback.textContent='¡Correcto!';mcFeedback.className='feedback good'}
      else{b.classList.add('wrong');mcFeedback.textContent=`Incorrecto. La respuesta es: ${correct}`;mcFeedback.className='feedback bad'}
      mcScore.textContent=`Puntos: ${mcPoints}`;
      setTimeout(()=>{mcIndex++;renderMC()},900);
    };
    mcOptions.appendChild(b);
  });
}
startMC();

// WRITING
let writeDeck=shuffle(vocab), writeIndex=0, writePoints=0, writeLocked=false;
function renderWrite(){
  if(writeIndex>=writeDeck.length){
    writeArea.innerHTML=`<div class="summary"><h2>¡Actividad terminada!</h2><div class="score">${writePoints}/${writeDeck.length}</div><p>Respuestas correctas</p><button class="btn primary" onclick="location.reload()">Volver a empezar</button></div>`;
    return;
  }
  writeLocked=false;
  writeQuestion.textContent=writeDeck[writeIndex][0];
  writeCount.textContent=`${writeIndex+1} / ${writeDeck.length}`;
  writeScore.textContent=`Puntos: ${writePoints}`;
  writeProgress.style.width=`${(writeIndex/writeDeck.length)*100}%`;
  writeInput.value='';
  writeInput.disabled=false;
  writeFeedback.textContent='';writeFeedback.className='feedback';
  setTimeout(()=>writeInput.focus(),100);
}
function checkWriting(){
  if(writeLocked) return;
  const answer=writeInput.value;
  if(!answer.trim()) return;
  writeLocked=true;
  const correct=writeDeck[writeIndex][1];
  if(normalize(answer)===normalize(correct)){
    writePoints++;
    writeFeedback.textContent='¡Correcto!';
    writeFeedback.className='feedback good';
  } else {
    writeFeedback.textContent=`Respuesta correcta: ${correct}`;
    writeFeedback.className='feedback bad';
  }
  writeScore.textContent=`Puntos: ${writePoints}`;
  writeInput.disabled=true;
  setTimeout(()=>{writeIndex++;renderWrite()},1000);
}
checkWrite.onclick=checkWriting;
skipWrite.onclick=()=>{if(writeLocked)return;writeFeedback.textContent=`Respuesta: ${writeDeck[writeIndex][1]}`;writeFeedback.className='feedback bad';writeLocked=true;setTimeout(()=>{writeIndex++;renderWrite()},900)};
writeInput.addEventListener('keydown',e=>{if(e.key==='Enter')checkWriting()});
renderWrite();

// LISTA
listCount.textContent=`${vocab.length} palabras`;
vocabList.innerHTML=vocab.map(([en,es])=>`<div class="vocab-item"><strong>${en}</strong><span>${es}</span></div>`).join('');
</script>
</body>
</html>
